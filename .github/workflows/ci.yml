name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test relay-core
        run: cargo test -p relay-core

      - name: Typecheck
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      # cargo check compiles the Tauri context, which needs the frontendDist directory.
      - name: Build frontend
        run: pnpm build

      - name: Check workspace
        run: cargo check
