[package]
name = "relay-core"
version = "0.1.0"
edition = "2024"
description = "Relay's local task graph: model, SQLite store, connectors and jobs"
authors = ["Bruno Koster"]
license = "MIT"
repository = "https://github.com/uFleck/relay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
