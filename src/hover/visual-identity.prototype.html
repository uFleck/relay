<!doctype html>
<!--
  PROTOTYPE, throwaway (wayfinder ticket "Visual identity direction, built around the Composer", relay#14).
  Round 3: F (Spotlight) won round 2. Every variant here is built on F and the "relay." wordmark.
  Round 1–2 variants (A–G) live in commit 9828f09 on this branch.
  Switch with ?variant=F|H|I|J|K, the floating bar, or ← →.
  Try: several lines, each starting with "!" / "?" / "??" (or none), "@" opens the picker, "+project". Ctrl+Enter sends.
  Fixes from round 2: the palette's light is now per line and follows each line's directive; References and
  lights animate only when they first appear or change kind, not on every keypress.
  The hover window is transparent, Rust-sized and cannot paint outside its own box: no scrim, no outer glow.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relay v2 identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; }
section[data-v] { display: none; position: fixed; inset: 0; }
body[data-v="F"] section[data-v="F"], body[data-v="H"] section[data-v="H"], body[data-v="I"] section[data-v="I"],
body[data-v="J"] section[data-v="J"], body[data-v="K"] section[data-v="K"] { display: block; }

/* ---------- family tokens (F) ---------- */
section[data-v] {
  --bg: #0f1015; --panel: #171921; --panel2: #1d2029; --line: #262935; --ink: #eceef5; --dim: #9196ab; --faint: #565b70;
  --act: #ff6a4d; --wait: #19c3b1; --grill: #a07dff; --chip: #222849; --chip-ink: #b3bcff; --err: #ff5d63;
  --gut: 22px; --cmp-pad: 16px 20px 16px var(--gut); --cmp-lh: 30px; --cmp-min: 30px; --cmp-ink: var(--ink); --cmp-caret: var(--ink); --cmp-ph: var(--faint);
  background: var(--bg); color: var(--ink); font: 400 14px/1.5 "Bricolage Grotesque", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) {
  section[data-v]:not([data-v="K"]) { --bg: #f1f2f6; --panel: #ffffff; --panel2: #f6f7fa; --line: #e1e3ea; --ink: #191b25; --dim: #686d86; --faint: #a6aabd; --chip: #eef0ff; --chip-ink: #3a46c4; }
}
.k-act { --k: var(--act); } .k-wait { --k: var(--wait); } .k-grill { --k: var(--grill); }
.mono { font-family: "Geist Mono", Consolas, monospace; }

/* shared composer mechanics: a transparent textarea over a highlighted mirror */
.cmp { position: relative; }
.cmp textarea, .cmp .hl { margin: 0; border: 0; padding: var(--cmp-pad); width: 100%; font: inherit; line-height: var(--cmp-lh); letter-spacing: inherit; white-space: pre-wrap; overflow-wrap: break-word; }
.cmp .hl { pointer-events: none; color: var(--cmp-ink); min-height: var(--cmp-min); }
.cmp textarea { position: absolute; inset: 0; height: 100%; resize: none; outline: none; background: transparent; color: transparent; caret-color: var(--cmp-caret); overflow: hidden; }
.cmp textarea::placeholder { color: var(--cmp-ph); }
.hl .ln { display: block; position: relative; min-height: var(--cmp-lh); }
.hl .cm { display: inline-block; width: 0; }
.hl .sg { color: var(--k); font-weight: 700; }
.ref { background: var(--chip); color: var(--chip-ink); border-radius: 6px; box-shadow: 0 0 0 2px var(--chip); }
.ref.bad { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--err) 14%, transparent); }
.prj { color: var(--grill); }
/* animate once, when the thing first appears (class .pop is added by settle(), never on plain keystrokes) */
.hl .ref.pop { animation: ref-in .7s ease-out 1; }
@keyframes ref-in { from { box-shadow: 0 0 0 7px color-mix(in srgb, var(--chip-ink) 45%, transparent); background: color-mix(in srgb, var(--chip-ink) 35%, var(--chip)); } }
.pick { display: none; }
.pick.open { display: block; }
@keyframes pop { from { transform: scale(.3); } }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes unfold { from { transform: scaleY(.4); opacity: 0; } }
@keyframes light-in { from { transform: scaleY(0); opacity: 0; } }
@keyframes drop { from { transform: translateY(-60px) scale(.9); opacity: 0; } }
@keyframes rise { from { transform: translateY(60px) scale(.95); opacity: 0; } }

/* ---------- "relay." wordmark: the dot takes the colour of what you're typing ---------- */
.brand { font: 800 26px "Bricolage Grotesque"; letter-spacing: -.04em; }
.brand .dot { color: var(--brand-k, var(--act)); transition: color .35s; display: inline-block; }
.brand .dot.bump { animation: pop .45s cubic-bezier(.3,1.8,.5,1) 1; }

/* ---------- main window shell shared by F/H/J/K ---------- */
.win { position: absolute; left: 40px; top: 40px; right: 40px; bottom: 70px; display: grid; grid-template-columns: 200px 1fr; gap: 28px; }
.side { display: flex; flex-direction: column; gap: 4px; font: 400 12px "Geist Mono"; }
.side .brand { margin-bottom: 18px; }
.side a { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 8px; color: var(--dim); text-decoration: none; }
.side a.on { background: var(--panel); color: var(--ink); }
.side .n { color: var(--act); font-weight: 600; display: inline-block; }
.side .n.bump { animation: pop .5s cubic-bezier(.3,1.8,.5,1) 1; }
.side .hint { margin-top: auto; color: var(--faint); font-size: 11px; line-height: 1.8; }
.side kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--dim); }

/* ---------- timeline spine ---------- */
.tl { overflow: auto; position: relative; padding: 0 0 40px 34px; }
.tl::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 0; width: 2px; background: var(--line); }
.tl .day { font: 700 13px "Geist Mono"; color: var(--dim); text-transform: uppercase; letter-spacing: .14em; margin: 14px 0 6px; }
.tl .day span { color: var(--faint); }
.it { position: relative; padding: 6px 0 10px; }
.it .pt { position: absolute; left: -28px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--dim); }
.it[class*="k-"] .pt { background: var(--k); border-color: var(--k); }
.it .t { font: 400 11px "Geist Mono"; color: var(--faint); }
.it .tx { font-size: 16px; }
.tl .ref { font: 500 12px "Geist Mono"; padding: 0 4px; }
.br { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.task { position: relative; display: flex; align-items: center; gap: 10px; font-size: 13px; padding-left: 20px; }
.task::before { content: ""; position: absolute; left: 0; top: -14px; height: 25px; width: 14px; border-left: 2px solid var(--k); border-bottom: 2px solid var(--k); border-bottom-left-radius: 10px; }
.task:not(:first-child)::before { top: -16px; height: 27px; }
.task b { color: var(--k); font-family: "Geist Mono"; }
.st { font: 500 11px "Geist Mono"; padding: 1px 8px; border-radius: 999px; }
.st.needs { background: var(--act); color: #fff; } .st.flight { color: var(--wait); background: color-mix(in srgb, var(--wait) 15%, transparent); animation: pulse 1.5s infinite; } .st.closed { color: var(--faint); }
.task .prj { font: 11px "Geist Mono"; }
.it.new { animation: drop .7s cubic-bezier(.3,1.4,.5,1) 1; }

/* ---------- the palette (hover window) shared bits ---------- */
.spot { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.spot .cmp { font-size: 20px; }
.spot .ft { display: flex; gap: 14px; padding: 8px 20px 8px var(--gut); border-top: 1px solid var(--line); font: 400 11px "Geist Mono"; color: var(--faint); }
.spot .ft .stat { margin-left: auto; color: var(--dim); }
.spot .pick { border-top: 1px solid var(--line); padding: 6px; max-height: 280px; overflow: auto; }
.spot .pick.open { animation: unfold .3s cubic-bezier(.3,1.4,.5,1) 1; transform-origin: top; }
.spot .pick .grp { padding: 6px 14px 2px; font: 500 10.5px "Geist Mono"; text-transform: uppercase; letter-spacing: .14em; color: var(--faint); }
.spot .pick .row { display: grid; grid-template-columns: 200px 1fr 60px; gap: 12px; padding: 7px 14px; border-radius: 10px; }
.spot .pick .row .id { font: 500 12.5px "Geist Mono"; color: var(--chip-ink); }
.spot .pick .row .ti { color: var(--dim); }
.spot .pick .row .kd { font: 400 11px "Geist Mono"; color: var(--faint); text-align: right; }
.spot .pick .row.on { background: var(--chip); }
.spot .pick .row.on .ti { color: var(--ink); }

/* ================================================================
   F · SPOTLIGHT (fixed). Each line gets its own light in the left
   edge, coloured by that line's directive; a Note line stays dark.
   ================================================================ */
section[data-v="F"] .spot { left: 50%; top: 18%; transform: translateX(-50%); width: 720px; }
section[data-v="F"] .hl .ln[class*="k-"]::before { content: ""; position: absolute; left: calc(-1 * var(--gut)); top: 3px; bottom: 3px; width: 4px; border-radius: 0 4px 4px 0; background: var(--k); }
section[data-v="F"] .hl .ln.pop::before { animation: light-in .35s cubic-bezier(.3,1.5,.5,1) 1; }

/* ================================================================
   H · PREVIEW TRAY. F plus a live tray under the input: one row per
   directive line showing the Task it will become (kind, text, project
   and where the project came from). Lights become full-line tints.
   ================================================================ */
section[data-v="H"] .spot { left: 50%; top: 14%; transform: translateX(-50%); width: 760px; }
section[data-v="H"] .hl .ln[class*="k-"] { background: linear-gradient(90deg, color-mix(in srgb, var(--k) 16%, transparent), transparent 70%); margin-left: calc(-1 * var(--gut)); padding-left: var(--gut); box-shadow: inset 3px 0 var(--k); }
section[data-v="H"] .hl .ln.pop { animation: tint-in .45s ease-out 1; }
@keyframes tint-in { from { background-size: 0 100%; background-repeat: no-repeat; } to { background-size: 100% 100%; } }
.tray { border-top: 1px solid var(--line); padding: 8px 12px 10px; background: var(--panel2); }
.tray:empty { display: none; }
.tray .hd { font: 500 10.5px "Geist Mono"; text-transform: uppercase; letter-spacing: .14em; color: var(--faint); padding: 2px 6px 6px; }
.tray .tk { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 10px; align-items: center; padding: 6px; border-radius: 10px; }
.tray .tk.pop { animation: pop .4s cubic-bezier(.3,1.6,.5,1) 1; }
.tray .tk .b { width: 30px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--k); color: #fff; font: 700 13px "Geist Mono"; }
.tray .tk .x { font-size: 14px; }
.tray .tk .x i { color: var(--faint); font-style: normal; font-size: 12px; margin-left: 6px; }
.tray .tk .pj { font: 500 11.5px "Geist Mono"; color: var(--grill); }
.tray .tk .pj small { color: var(--faint); font-weight: 400; margin-left: 4px; }
.tray .tk .pj.miss { color: var(--act); }
.tray .tk .rf { font: 400 11px "Geist Mono"; color: var(--faint); }

/* ================================================================
   I · TRANSIT. The palette's gutter is a little metro line: every
   line is a station, coloured by its directive, joined by track.
   The Notebook becomes a transit map: Notes run down the grey trunk,
   each Task is a station on its directive's own coloured line.
   ================================================================ */
section[data-v="I"] { --gut: 44px; }
section[data-v="I"] .spot { left: 50%; top: 16%; transform: translateX(-50%); width: 700px; }
section[data-v="I"] .hl .ln::before { content: ""; position: absolute; left: -26px; top: 10px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--faint); background: var(--panel); z-index: 1; }
section[data-v="I"] .hl .ln[class*="k-"]::before { border-color: var(--k); background: var(--k); width: 14px; height: 14px; left: -28px; top: 8px; }
section[data-v="I"] .hl .ln::after { content: ""; position: absolute; left: -22px; top: -2px; bottom: -2px; width: 2px; background: var(--line); }
section[data-v="I"] .hl .ln.pop::before { animation: pop .4s cubic-bezier(.3,1.8,.5,1) 1; }
.map { position: absolute; left: 40px; top: 40px; right: 40px; bottom: 70px; display: grid; grid-template-rows: auto 1fr; }
.map .top { display: flex; align-items: baseline; gap: 26px; padding-bottom: 14px; font: 400 12px "Geist Mono"; }
.map .top a { color: var(--dim); text-decoration: none; }
.map .top a.on { color: var(--ink); }
.map .top .n { color: var(--act); font-weight: 600; display: inline-block; }
.map .top .n.bump { animation: pop .5s cubic-bezier(.3,1.8,.5,1) 1; }
.map .grid { overflow: auto; display: grid; grid-template-columns: 56px minmax(0,1fr) 190px 190px 190px; align-content: start; }
.map .lh { position: sticky; top: 0; background: var(--bg); z-index: 2; padding: 6px 0 10px; font: 600 11px "Geist Mono"; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.map .lh.trk { text-align: center; color: var(--k); }
.map .cell { position: relative; min-height: 48px; padding: 8px 0; }
.map .trunk { padding-left: 30px; }
.map .trunk::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 4px; background: var(--line); border-radius: 2px; }
.map .trunk .pt { position: absolute; left: 3px; top: 13px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 3px solid var(--dim); }
.map .trunk .tx { font-size: 15px; }
.map .trunk .ref { font: 500 12px "Geist Mono"; padding: 0 4px; }
.map .tm { font: 400 11px "Geist Mono"; color: var(--faint); padding-top: 12px; }
.map .trk.cell::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: color-mix(in srgb, var(--k) 35%, transparent); }
.map .stn { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 2px 6px; }
.map .stn::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 4px solid var(--k); margin-bottom: 2px; }
.map .stn .x { font-size: 12.5px; background: var(--bg); padding: 0 4px; border-radius: 4px; line-height: 1.3; }
.map .stn.new::before { animation: pop .5s cubic-bezier(.3,1.8,.5,1) 1; }
.map .dayrow { grid-column: 1 / -1; font: 700 13px "Geist Mono"; color: var(--dim); text-transform: uppercase; letter-spacing: .14em; padding: 14px 0 4px; }
.map .dayrow span { color: var(--faint); }
.map .row-new { animation: drop .6s cubic-bezier(.3,1.4,.5,1) 1; }

/* ================================================================
   J · DOCK. The palette lives at the bottom centre and the Notebook
   reads like a conversation: newest at the bottom, landing right
   above where you type. Per-line lights are glowing beads that pulse
   while the line is a live directive. The picker opens upward.
   ================================================================ */
section[data-v="J"] { --gut: 40px; }
section[data-v="J"] .win { bottom: 210px; }
section[data-v="J"] .tl { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; }
section[data-v="J"] .it.new { animation: rise .7s cubic-bezier(.3,1.4,.5,1) 1; }
section[data-v="J"] .spot { left: 50%; bottom: 70px; transform: translateX(-50%); width: 760px; display: flex; flex-direction: column-reverse; border-radius: 22px; }
section[data-v="J"] .spot .ft { border-top: 0; border-bottom: 1px solid var(--line); }
section[data-v="J"] .spot .pick { border-top: 0; border-bottom: 1px solid var(--line); }
section[data-v="J"] .spot .pick.open { transform-origin: bottom; }
section[data-v="J"] .hl .ln[class*="k-"]::before { content: ""; position: absolute; left: -26px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--k); box-shadow: 0 0 0 4px color-mix(in srgb, var(--k) 22%, transparent); animation: bead 1.8s ease-in-out infinite; }
@keyframes bead { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--k) 8%, transparent); } }

/* ================================================================
   K · LENS (daylight). F's palette, light-first, with a lens: the
   picker has a detail pane that reads the highlighted Reference's live
   state (read-only), so you know what you're pointing at before you
   send. Lights become a labelled tag per line.
   ================================================================ */
section[data-v="K"] { --bg: #f4f1ea; --panel: #fffdf8; --panel2: #f8f5ee; --line: #e6e0d4; --ink: #1d1a15; --dim: #6f685c; --faint: #ada597; --chip: #efeaff; --chip-ink: #4a3fc2; --act: #f0522e; --wait: #0f9e8f; --grill: #7a52f0; --gut: 58px; }
section[data-v="K"] .spot { left: 50%; top: 16%; transform: translateX(-50%); width: 820px; border-radius: 14px; }
section[data-v="K"] .hl .ln::before { content: "note"; position: absolute; left: -50px; top: 7px; width: 38px; text-align: center; font: 500 10px/16px "Geist Mono"; color: var(--faint); border-radius: 5px; }
section[data-v="K"] .hl .ln.k-act::before { content: "act"; } section[data-v="K"] .hl .ln.k-wait::before { content: "wait"; } section[data-v="K"] .hl .ln.k-grill::before { content: "grill"; }
section[data-v="K"] .hl .ln[class*="k-"]::before { color: #fff; background: var(--k); }
section[data-v="K"] .hl .ln.pop::before { animation: pop .35s cubic-bezier(.3,1.8,.5,1) 1; }
section[data-v="K"] .pick.open { display: grid; grid-template-columns: 1fr 260px; column-gap: 6px; align-content: start; }
section[data-v="K"] .pick .grp, section[data-v="K"] .pick .row { grid-column: 1; }
section[data-v="K"] .pick .row { grid-template-columns: 170px 1fr; }
section[data-v="K"] .pick .row .kd { display: none; }
.lens { grid-row: 1 / 99; grid-column: 2; border-left: 1px solid var(--line); padding: 10px 14px; font-size: 13px; }
.lens .kd { font: 500 10.5px "Geist Mono"; text-transform: uppercase; letter-spacing: .14em; color: var(--faint); }
.lens .id { font: 600 13px "Geist Mono"; color: var(--chip-ink); margin: 4px 0; }
.lens .ti { font: 600 16px/1.3 "Bricolage Grotesque"; }
.lens .state { display: inline-block; margin: 8px 0 6px; font: 500 11px "Geist Mono"; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--wait) 16%, transparent); color: var(--wait); }
.lens .meta { font: 400 11.5px/1.7 "Geist Mono"; color: var(--dim); }
.lens .ro { margin-top: 10px; font: 400 10.5px "Geist Mono"; color: var(--faint); }

/* switcher: deliberately not part of any design */
#sw { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 6px; padding: 5px 6px; background: #111; color: #fff; border-radius: 999px; font: 500 12px system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,.35); outline: 2px dashed #ff0; outline-offset: 2px; }
#sw button { border: 0; background: #333; color: #fff; border-radius: 999px; height: 26px; min-width: 26px; padding: 0 10px; cursor: pointer; font: inherit; }
#sw button:hover { background: #555; }
#sw .lbl { min-width: 400px; text-align: center; }
#sw .lbl small { color: #aaa; font-weight: 400; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body data-v="F">

<template id="side">
  <nav class="side"><div class="brand">relay<span class="dot">.</span></div><a class="on" href="#">Notebook</a><a href="#">Tasks <span class="n badge">3</span></a><a href="#">Settings</a>
    <div class="hint"><kbd>alt</kbd>+<kbd>space</kbd> summon<br /><kbd>ctrl</kbd>+<kbd>↵</kbd> send<br /><kbd>esc</kbd> dismiss</div></nav>
</template>
<template id="spot">
  <div class="cmp"><div class="hl"></div><textarea rows="1" spellcheck="false" placeholder="Write a note. ! acts, ? waits, ?? grills."></textarea></div>
  <div class="pick"></div>
  <div class="ft"><span>@ reference</span><span>+ project</span><span>ctrl ↵ send</span><span class="stat">note</span></div>
</template>

<section data-v="F"><div class="win"><slot-side></slot-side><div class="tl feed"></div></div><div class="spot"></div></section>
<section data-v="H"><div class="win"><slot-side></slot-side><div class="tl feed"></div></div><div class="spot"><div class="tray"></div></div></section>
<section data-v="I">
  <div class="map">
    <nav class="top"><span class="brand">relay<span class="dot">.</span></span><a class="on" href="#">Notebook</a><a href="#">Tasks <span class="n badge">3</span></a><a href="#">Settings</a></nav>
    <div class="grid feed"></div>
  </div>
  <div class="spot"></div>
</section>
<section data-v="J"><div class="win"><slot-side></slot-side><div class="tl feed"></div></div><div class="spot"></div></section>
<section data-v="K"><div class="win"><slot-side></slot-side><div class="tl feed"></div></div><div class="spot"></div></section>

<div id="sw"><button data-prev>←</button><span class="lbl"></span><button data-next>→</button><button data-play>▶ Play</button></div>

<script>
// assemble the shared chrome from templates
document.querySelectorAll("slot-side").forEach(s => s.replaceWith(document.getElementById("side").content.cloneNode(true)));
document.querySelectorAll(".spot").forEach(s => s.prepend(document.getElementById("spot").content.cloneNode(true)));

const REFS = [
  { kind: "Card", id: "CU-8x1k2", title: "Retry storm on webhooks", state: "in progress", meta: ["list · Platform", "assignee · you", "updated · 2h ago"] },
  { kind: "Card", id: "CU-7h2p9", title: "CSV export times out", state: "open", meta: ["list · Web", "assignee · unassigned", "updated · yesterday"] },
  { kind: "PR", id: "billing-api#142", title: "Backoff with jitter", state: "checks passing", meta: ["repo · billing-api", "branch · fix/backoff", "+84 −12 · 3 files"] },
  { kind: "PR", id: "billing-api#139", title: "Add idempotency keys", state: "merged", meta: ["repo · billing-api", "merged · Fri 20 Nov", "+210 −40 · 7 files"] },
  { kind: "PR", id: "web-app#88", title: "Settings layout pass", state: "review requested", meta: ["repo · web-app", "branch · ui/settings", "+120 −98 · 5 files"] },
  { kind: "Issue", id: "web-app#91", title: "Dark mode contrast on tables", state: "open", meta: ["repo · web-app", "labels · ui, a11y", "opened · 3d ago"] },
  { kind: "Slack", id: "#support/1731000000", title: "webhooks failing for some accounts", state: "12 replies", meta: ["channel · #support", "last reply · 40m ago", "cached · 9:14"] },
  { kind: "Note", id: "N-12", title: "Standup: retry storm again", state: "note", meta: ["written · today 09:12"] },
];
const KNOWN = new Set(REFS.map(r => r.id));
const STATUS = { "briefing": "flight", "grilling": "flight", "dispatched": "flight", "awaiting approval": "needs", "needs answer": "needs", "needs project": "needs", "returned": "needs", "done": "closed" };
const NMARK = "\u0000";

let feed = [
  { day: "Yesterday", t: "17:40", text: "@billing-api#139 Add idempotency keys", src: "PR", tasks: [] },
  { day: "Yesterday", t: "16:02", text: "should we drop the legacy export endpoint", tasks: [{ sg: "??", text: "drop the legacy export endpoint", st: "done", prj: "web-app" }] },
  { day: "Today", t: "09:12", text: "Standup: retry storm on webhooks again, see @#support/1731000000", tasks: [] },
  { day: "Today", t: "09:40", text: "webhook retries hammer the queue @billing-api#142", tasks: [{ sg: "!", text: "fix webhook retry backoff", st: "dispatched", prj: "billing-api" }, { sg: "?", text: "write a postmortem draft", st: "awaiting approval", prj: "billing-api" }] },
  { day: "Today", t: "10:05", text: "export is slow for big accounts @CU-7h2p9", tasks: [{ sg: "?", text: "draft a migration plan", st: "awaiting approval", prj: "web-app" }] },
];

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dirOf = line => line.startsWith("??") ? ["??", "grill"] : line.startsWith("!") ? ["!", "act"] : line.startsWith("?") ? ["?", "wait"] : null;
const kOf = sg => sg === "!" ? "k-act" : sg === "?" ? "k-wait" : "k-grill";
const inline = s => esc(s).replace(/(@[\w#\/.\-]+)|(\+[\w-]+)/g, (m, r, p) =>
  r ? `<span class="ref${KNOWN.has(r.slice(1)) ? "" : " bad"}">${r}</span>` : `<span class="prj">${p}</span>`);
const dayLabel = d => d === "Today" ? "Sat 21 Nov" : "Fri 20 Nov";

function highlight(text, caret) {
  const withMark = text.slice(0, caret) + NMARK + text.slice(caret);
  return withMark.split("\n").map(line => {
    const d = dirOf(line.replace(NMARK, ""));
    let body = line, sg = "";
    if (d) { const at = line.indexOf(NMARK), n = d[0].length + (at >= 0 && at < d[0].length ? 1 : 0); sg = line.slice(0, n); body = line.slice(n); }
    const h = s => inline(s).replace(NMARK, '<i class="cm"></i>');
    return `<span class="ln${d ? " k-" + d[1] : ""}">${sg ? `<span class="sg">${h(sg)}</span>` : ""}${h(body) || "&#8203;"}</span>`;
  }).join("");
}
// Mark only what is new since the last paint: a line whose directive changed, a Reference that just resolved.
// Keystrokes inside an existing line or Reference never retrigger an animation.
function settle(root, sel, keyOf, state, name) {
  const seen = new Set(), counts = {};
  root.querySelectorAll(sel).forEach((el, i) => {
    const base = keyOf(el, i), n = (counts[base] = (counts[base] || 0) + 1), key = base + "#" + n;
    if (state[name] && !state[name].has(key)) el.classList.add("pop");
    seen.add(key);
  });
  state[name] = seen;
}

/* ---------- task resolution, shared by send() and H's tray ---------- */
function plan(text) {
  const lines = text.split("\n");
  const noteRepo = (text.match(/@([\w-]+)#\d+/) || [])[1], noteP = (text.match(/\+([\w-]+)/) || [])[1];
  return lines.map(l => {
    const d = dirOf(l); if (!d) return null;
    const lp = (l.match(/\+([\w-]+)/) || [])[1], lr = l.match(/@(([\w-]+)#\d+)/);
    const [prj, from] = lp ? [lp, "+project"] : noteP ? [noteP, "note's +project"] : lr ? [lr[2], "from @" + lr[1]] : noteRepo ? [noteRepo, "from the note's PR/issue"] : [null, ""];
    return { sg: d[0], kind: d[1], text: l.slice(d[0].length).replace(/@\S+|\+\S+/g, "").replace(/\s+/g, " ").trim(), refs: (l.match(/@\S+/g) || []).length, prj, from };
  }).filter(Boolean);
}

/* ---------- feed renderers ---------- */
const fresh = e => e.fresh ? " new" : "";
function spine(sec, newestLast) {
  const items = newestLast ? feed : [...feed].reverse();
  let out = "", day = null;
  for (const e of items) {
    if (e.day !== day) { day = e.day; out += `<div class="day">${day} <span>${dayLabel(day)}</span></div>`; }
    const k = e.tasks[0] ? kOf(e.tasks[0].sg) : "";
    out += `<div class="it ${k}${fresh(e)}"><span class="pt"></span><div class="t">${e.t}${e.src ? " · imported " + e.src : ""}</div><div class="tx">${inline(e.text)}</div>` +
      (e.tasks.length ? `<div class="br">${e.tasks.map(t => `<div class="task ${kOf(t.sg)}"><b>${esc(t.sg)}</b>${esc(t.text)}<span class="st ${STATUS[t.st]}">${t.st}</span><span class="prj">+${t.prj}</span></div>`).join("")}</div>` : "") + `</div>`;
  }
  const el = sec.querySelector(".feed"); el.innerHTML = out;
  if (newestLast) el.scrollTop = 1e6;
}
function transit(sec) {
  let out = `<div class="lh"></div><div class="lh">Notes</div><div class="lh trk k-act">! act</div><div class="lh trk k-wait">? wait</div><div class="lh trk k-grill">?? grill</div>`, day = null;
  for (const e of [...feed].reverse()) {
    if (e.day !== day) { day = e.day; out += `<div class="dayrow">${day} <span>${dayLabel(day)}</span></div>`; }
    const lane = kind => e.tasks.filter(t => kOf(t.sg) === kind).map(t => `<div class="stn ${kind}${fresh(e)}"><span class="x">${esc(t.text)}</span><span class="st ${STATUS[t.st]}">${t.st}</span></div>`).join("");
    const r = e.fresh ? " row-new" : "";
    out += `<div class="cell tm${r}">${e.t}</div><div class="cell trunk${r}"><span class="pt"></span><div class="tx">${inline(e.text)}${e.src ? ` <span class="mono" style="color:var(--faint);font-size:11px">imported ${e.src}</span>` : ""}</div></div>` +
      ["k-act", "k-wait", "k-grill"].map(k => `<div class="cell trk ${k}${r}">${lane(k)}</div>`).join("");
  }
  sec.querySelector(".feed").innerHTML = out;
}
const RENDER = { F: s => spine(s), H: s => spine(s), I: transit, J: s => spine(s, true), K: s => spine(s) };
const KEYS = ["F", "H", "I", "J", "K"];
const NAMES = {
  F: ["Spotlight", "fixed: one light per line, per directive"],
  H: ["Preview Tray", "see each Task before you send it"],
  I: ["Transit", "Notes on a trunk, Tasks on coloured lines"],
  J: ["Dock", "palette at the bottom, newest lands above it"],
  K: ["Lens", "daylight; picker reads the Reference's live state"],
};
const secOf = v => document.querySelector(`section[data-v="${v}"]`);
const needsCount = () => feed.flatMap(e => e.tasks).filter(k => STATUS[k.st] === "needs").length + 1;
function renderAll(bump) {
  for (const v of KEYS) {
    const sec = secOf(v); RENDER[v](sec);
    const b = sec.querySelector(".badge"); b.textContent = needsCount();
    if (bump) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  }
}

/* ---------- composer behaviour, shared ---------- */
function setupComposer(v) {
  const sec = secOf(v), ta = sec.querySelector("textarea"), hl = sec.querySelector(".hl"), pick = sec.querySelector(".pick"), stat = sec.querySelector(".stat"), tray = sec.querySelector(".tray");
  const anim = {};
  let items = [], sel = 0, query = null, lastFirst;
  function paint() {
    hl.innerHTML = highlight(ta.value, ta.selectionStart);
    settle(hl, ".ln", (el, i) => "L" + i + (el.className.match(/k-\w+/) || ["note"])[0], anim, "ln");
    settle(hl, ".ref:not(.bad)", el => el.textContent, anim, "ref");
    ta.style.height = hl.offsetHeight + "px";
    const tasks = plan(ta.value), first = tasks[0]?.kind;
    stat.textContent = tasks.length ? `${tasks.length} task${tasks.length > 1 ? "s" : ""}: ${tasks.map(t => t.kind).join(", ")}` : "note";
    // the wordmark's dot follows the first directive you're writing
    sec.style.setProperty("--brand-k", first ? `var(--${first})` : "var(--act)");
    if (first !== lastFirst) { const d = sec.querySelector(".brand .dot"); d.classList.remove("bump"); void d.offsetWidth; d.classList.add("bump"); lastFirst = first; }
    if (tray) {
      tray.innerHTML = tasks.length ? `<div class="hd">will create ${tasks.length} task${tasks.length > 1 ? "s" : ""}</div>` + tasks.map(t =>
        `<div class="tk k-${t.kind}"><span class="b">${esc(t.sg)}</span><span class="x">${esc(t.text) || "<i>(empty)</i>"}${t.refs ? `<i>${t.refs} ref${t.refs > 1 ? "s" : ""}</i>` : ""}</span>` +
        `<span class="pj${t.prj ? "" : " miss"}">${t.prj ? "+" + esc(t.prj) + `<small>${esc(t.from)}</small>` : "needs project"}</span><span class="rf">${t.kind === "act" ? "dispatch" : t.kind === "wait" ? "approve first" : "grill first"}</span></div>`).join("") : "";
      settle(tray, ".tk", (el, i) => "T" + i + el.className, anim, "tk");
    }
    const m = ta.value.slice(0, ta.selectionStart).match(/@([\w#\/.\-]*)$/); query = m ? m[1] : null;
    if (query === null) { pick.classList.remove("open"); return; }
    const q = query.toLowerCase();
    items = REFS.filter(r => (r.id + " " + r.title).toLowerCase().includes(q));
    if (!items.length) { pick.classList.remove("open"); return; }
    sel = Math.min(sel, items.length - 1);
    let last = null, html = "";
    items.forEach((r, i) => {
      if (r.kind !== last) { html += `<div class="grp">${r.kind}</div>`; last = r.kind; }
      html += `<div class="row${i === sel ? " on" : ""}"><span class="id">@${esc(r.id)}</span><span class="ti">${esc(r.title)}</span><span class="kd">${r.kind}</span></div>`;
    });
    if (v === "K") { const r = items[sel]; html += `<div class="lens"><div class="kd">${r.kind}</div><div class="id">@${esc(r.id)}</div><div class="ti">${esc(r.title)}</div><span class="state">${esc(r.state)}</span><div class="meta">${r.meta.map(esc).join("<br>")}</div><div class="ro">read-only · the agent does any writes</div></div>`; }
    pick.innerHTML = html; pick.classList.add("open");
  }
  function accept() {
    const r = items[sel], start = ta.selectionStart - query.length - 1;
    ta.value = ta.value.slice(0, start) + "@" + r.id + " " + ta.value.slice(ta.selectionStart);
    ta.selectionStart = ta.selectionEnd = start + r.id.length + 2; sel = 0; paint();
  }
  function send() {
    const text = ta.value.trim(); if (!text) return;
    const lines = text.split("\n"), t = new Date().toTimeString().slice(0, 5);
    const tasks = plan(text).map(p => ({ sg: p.sg, kind: p.kind, text: p.text, prj: p.prj ?? "?", st: p.kind === "grill" ? "grilling" : "briefing", hasPrj: !!p.prj }));
    const entry = { day: "Today", t, text: lines.filter(l => !dirOf(l)).join(" ") || "(tasks only)", tasks, fresh: true };
    feed.push(entry); ta.value = ""; paint(); renderAll(false); entry.fresh = false;
    tasks.forEach((k, i) => setTimeout(() => { k.st = !k.hasPrj ? "needs project" : k.kind === "act" ? "dispatched" : "awaiting approval"; renderAll(STATUS[k.st] === "needs"); }, 1600 + i * 500));
  }
  ta.addEventListener("input", paint);
  ta.addEventListener("click", paint);
  ta.addEventListener("keyup", e => { if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) paint(); });
  ta.addEventListener("keydown", e => {
    if (pick.classList.contains("open")) {
      if (e.key === "ArrowDown") { sel = (sel + 1) % items.length; paint(); e.preventDefault(); return; }
      if (e.key === "ArrowUp") { sel = (sel - 1 + items.length) % items.length; paint(); e.preventDefault(); return; }
      if (e.key === "Enter" || e.key === "Tab") { accept(); e.preventDefault(); return; }
      if (e.key === "Escape") { pick.classList.remove("open"); e.preventDefault(); return; }
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { send(); e.preventDefault(); }
  });
  paint();
  return { ta, paint, accept, send };
}

/* ---------- switcher ---------- */
const comps = {};
function setV(v, push = true) {
  document.body.dataset.v = v;
  document.querySelector("#sw .lbl").innerHTML = `${v} · ${NAMES[v][0]}<small>${NAMES[v][1]}</small>`;
  if (push) { const u = new URL(location); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
  comps[v] ??= setupComposer(v); RENDER[v](secOf(v));
}
const step = d => setV(KEYS[(KEYS.indexOf(document.body.dataset.v) + d + KEYS.length) % KEYS.length]);
document.querySelector("[data-prev]").onclick = () => step(-1);
document.querySelector("[data-next]").onclick = () => step(1);
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});

/* ---------- scripted demo: one note, three directive lines ---------- */
let playing = false;
document.querySelector("[data-play]").onclick = async () => {
  if (playing) return; playing = true;
  const c = comps[document.body.dataset.v], wait = ms => new Promise(r => setTimeout(r, ms));
  c.ta.focus(); c.ta.value = ""; c.paint();
  const type = async s => { for (const ch of s) { c.ta.setRangeText(ch, c.ta.selectionStart, c.ta.selectionEnd, "end"); c.paint(); await wait(ch === " " ? 70 : 42); } };
  await type("CSV export hangs past 30s for big accounts, see @exp"); await wait(900); c.accept(); await wait(300);
  await type("\n! stream the export endpoint @web"); await wait(700);
  c.ta.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown" })); await wait(500); c.accept(); await wait(300);
  await type("\n? check whether @CU-8x1k2 is the same bug"); await wait(500);
  await type("\n?? should big exports move to a job queue"); await wait(1600);
  c.send(); playing = false;
};

renderAll(false);
const qv = new URLSearchParams(location.search).get("variant");
setV(KEYS.includes(qv) ? qv : "F", false);
</script>
</body>
